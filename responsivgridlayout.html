<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Header - Tiêu đề trang</h1>
        </header>

        <!-- Navigation -->
        <nav class="nav">
            <a href="#">Trang chủ</a>
            <a href="#">Giới thiệu</a>
            <a href="#">Dịch vụ</a>
            <a href="#">Liên hệ</a>
        </nav>

        <!-- Sidebar -->
        <aside class="sidebar">
            <h3>Sidebar</h3>
            <p>Nội dung phụ (Tin tức, Quảng cáo...)</p>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <h2>Nội dung chính</h2>
            <p>Mô tả bài tập: Luyện tập sử dụng CSS Grid để tạo một bố cục trang web responsive, hiển thị tốt trên cả desktop và mobile.</p>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Footer - Thông tin cuối trang</p>
        </footer>
    </div>

</body>
</html>
