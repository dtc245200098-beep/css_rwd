<!DOCTYPE html>
<html lang="vi">
<head>
  <style>
    .grid-container {
      display: grid;
      /* Cột 1: 150px, Cột 2: Tự động theo nội dung, Cột 3: Chiếm toàn bộ khoảng trống còn lại */
      grid-template-columns: 150px auto 1fr;
      gap: 10px;
      background-color: #2196F3;
      padding: 10px;
    }

    .grid-item {
      background-color: rgba(255, 255, 255, 0.8);
      padding: 20px;
      font-size: 18px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <div class="grid-item">Cột 1 (150px)</div>
    <div class="grid-item">Cột 2 (auto)</div>
    <div class="grid-item">Cột 3 (1fr)</div>
  </div>

</body>
</html>
